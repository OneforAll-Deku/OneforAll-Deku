name: Update README trophy
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:        # Allows manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Essential to commit changes back to the repository
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=OneforAll-Deku&theme=tokyonight&no-frame=false&no-bg=true&margin-w=4&title=-PullRequest,-Issues,-Reviews'
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README trophy" && git push)
